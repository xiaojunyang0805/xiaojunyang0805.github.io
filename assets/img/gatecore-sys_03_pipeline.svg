<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Frigate inference path and pipelined timing budget</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="700" fill="#0f172a">(a) Per-frame path — Frigate detect_raw → GateCore → (20,6) result</text>

  <!-- stage chain -->
  <g font-size="12" text-anchor="middle">
    <rect x="20" y="44" width="130" height="70" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="85" y="66" font-weight="600" fill="#0f172a">Host plugin</text>
    <text x="85" y="84" fill="#475569">GC01 DETECT</text>
    <text x="85" y="102" fill="#475569">raw 307 KB or JPEG</text>

    <rect x="172" y="44" width="130" height="70" rx="6" fill="#fff7ed" stroke="#fb923c"/>
    <text x="237" y="66" font-weight="600" fill="#0f172a">USB OUT</text>
    <text x="237" y="84" fill="#475569">CDC-ACM bulk</text>
    <text x="237" y="102" fill="#b45309">V3: not measured</text>

    <rect x="324" y="44" width="120" height="70" rx="6" fill="#ecfdf5" stroke="#10b981"/>
    <text x="384" y="66" font-weight="600" fill="#0f172a">AI2D</text>
    <text x="384" y="84" fill="#475569">HWC → NCHW</text>
    <text x="384" y="102" fill="#047857">1.7 ms</text>

    <rect x="466" y="44" width="130" height="70" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="531" y="66" font-weight="600" fill="#0f172a">KPU</text>
    <text x="531" y="84" fill="#475569">yolov8n_320</text>
    <text x="531" y="102" fill="#047857">36.8 ms</text>

    <rect x="618" y="44" width="130" height="70" rx="6" fill="#ecfdf5" stroke="#10b981"/>
    <text x="683" y="66" font-weight="600" fill="#0f172a">Decode + NMS</text>
    <text x="683" y="84" fill="#475569">12 ms Python</text>
    <text x="683" y="102" fill="#047857">→ ~3 ms in C</text>

    <rect x="770" y="44" width="110" height="70" rx="6" fill="#fff7ed" stroke="#fb923c"/>
    <text x="825" y="66" font-weight="600" fill="#0f172a">USB IN</text>
    <text x="825" y="84" fill="#475569">480 B binary</text>
    <text x="825" y="102" fill="#047857">&lt; 1 ms</text>
  </g>
  <g stroke="#334155" stroke-width="1.5">
    <line x1="150" y1="79" x2="168" y2="79" marker-end="url(#a)"/>
    <line x1="302" y1="79" x2="320" y2="79" marker-end="url(#a)"/>
    <line x1="444" y1="79" x2="462" y2="79" marker-end="url(#a)"/>
    <line x1="596" y1="79" x2="614" y2="79" marker-end="url(#a)"/>
    <line x1="748" y1="79" x2="766" y2="79" marker-end="url(#a)"/>
  </g>
  <text x="20" y="134" font-size="11.5" fill="#64748b">Green numbers measured on Day 9 (2026-05-05, CanMV, same silicon); native-USB PING floor 0.27 ms p95 (T3).</text>
  <text x="20" y="150" font-size="11.5" fill="#64748b">USB OUT depends on CDC-ACM throughput (V3): raw 307 KB = 15 ms @ 20 MB/s, 77 ms @ 4 MB/s; a 22 KB JPEG ≈ 6 ms.</text>

  <!-- Gantt -->
  <text x="20" y="180" font-size="15" font-weight="700" fill="#0f172a">(b) Pipelined steady state — USB thread receives frame N+1 while the KPU runs frame N</text>
  <!-- axis: x = 120 + t*6  (t in ms, 0..120) -->
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <line x1="120" y1="372" x2="840" y2="372" stroke="#94a3b8"/>
    <text x="120" y="390">0</text><text x="240" y="390">20</text><text x="360" y="390">40</text><text x="480" y="390">60</text>
    <text x="600" y="390">80</text><text x="720" y="390">100</text><text x="840" y="390">120 ms</text>
  </g>
  <g stroke="#e2e8f0">
    <line x1="240" y1="196" x2="240" y2="372"/><line x1="360" y1="196" x2="360" y2="372"/><line x1="480" y1="196" x2="480" y2="372"/>
    <line x1="600" y1="196" x2="600" y2="372"/><line x1="720" y1="196" x2="720" y2="372"/>
  </g>
  <g font-size="12" fill="#0f172a">
    <text x="20" y="222">USB OUT</text>
    <text x="20" y="262">AI2D</text>
    <text x="20" y="302">KPU</text>
    <text x="20" y="342">NMS + IN</text>
  </g>
  <!-- assumed USB OUT 15 ms; AI2D 2; KPU 37; post+in 4 -->
  <!-- Frame N (blue) -->
  <rect x="120" y="206" width="90" height="24" fill="#93c5fd"/>
  <rect x="210" y="246" width="12" height="24" fill="#93c5fd"/>
  <rect x="222" y="286" width="222" height="24" fill="#93c5fd"/>
  <rect x="444" y="326" width="24" height="24" fill="#93c5fd"/>
  <text x="333" y="303" font-size="12" text-anchor="middle" fill="#1e3a8a">frame N</text>
  <!-- Frame N+1 (green) -->
  <rect x="210" y="206" width="90" height="24" fill="#86efac"/>
  <rect x="444" y="246" width="12" height="24" fill="#86efac"/>
  <rect x="456" y="286" width="222" height="24" fill="#86efac"/>
  <rect x="678" y="326" width="24" height="24" fill="#86efac"/>
  <text x="567" y="303" font-size="12" text-anchor="middle" fill="#14532d">frame N+1</text>
  <!-- Frame N+2 (amber) -->
  <rect x="300" y="206" width="90" height="24" fill="#fcd34d"/>
  <rect x="678" y="246" width="12" height="24" fill="#fcd34d"/>
  <rect x="690" y="286" width="150" height="24" fill="#fcd34d"/>
  <text x="765" y="303" font-size="12" text-anchor="middle" fill="#78350f">frame N+2 …</text>
  <text x="255" y="222" font-size="11" text-anchor="middle" fill="#14532d">N+1</text>
  <text x="345" y="222" font-size="11" text-anchor="middle" fill="#78350f">N+2</text>
  <text x="165" y="222" font-size="11" text-anchor="middle" fill="#1e3a8a">N</text>

  <rect x="20" y="402" width="860" height="56" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="36" y="425" font-size="12.5" fill="#0f172a">Assumes USB OUT 15 ms. Serial path ≈ 58 ms (≈ 17 FPS). Pipelined, the KPU is the bottleneck: one result every ~37 ms ≈ <tspan font-weight="700">27 FPS ceiling</tspan></text>
  <text x="36" y="446" font-size="12.5" fill="#0f172a">(matches the 27.2 FPS pure-KPU figure from Phase 0). Target is 15 FPS aggregate, so the margin holds even if USB OUT is 2–3× slower.</text>
</svg>
