<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="t d">
  <title id="t">COMSOL model chain and validation</title>
  <desc id="d">Coupled COMSOL model of a microelectrode: diffusion-limited current for disk and ring electrodes, plus electric currents, laminar flow and species transport feeding particle tracing. Simulated background current 0.872 nA sits inside the measured range of 0.81 to 0.88 nA.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6672"/></marker>
  </defs>
  <g font-family="Inter, system-ui, sans-serif" fill="#1d232a">
    <text x="16" y="26" font-size="13" font-weight="700">COMSOL 5.4 · coupled model</text>
    <g font-size="11.5" text-anchor="middle">
      <g fill="none" stroke="#5b6672" stroke-width="1.2">
        <rect x="16" y="42" width="138" height="40" rx="7"/>
        <rect x="16" y="94" width="138" height="40" rx="7"/>
        <rect x="16" y="146" width="138" height="40" rx="7"/>
        <rect x="200" y="94" width="122" height="40" rx="7" stroke="#0f766e" stroke-width="2"/>
        <rect x="358" y="94" width="106" height="40" rx="7" stroke="#d97706" stroke-width="2"/>
        <path d="M156 62C180 62 178 110 198 112" marker-end="url(#ah)"/>
        <path d="M156 114H198" marker-end="url(#ah)"/>
        <path d="M156 166C180 166 178 118 198 116" marker-end="url(#ah)"/>
        <path d="M324 114H356" marker-end="url(#ah)"/>
      </g>
      <text x="85" y="59">Electric currents</text><text x="85" y="74" font-size="10" fill="#5b6672">field, glass ζ = −60 mV</text>
      <text x="85" y="111">Laminar flow</text><text x="85" y="126" font-size="10" fill="#5b6672">electroosmotic walls</text>
      <text x="85" y="163">Transport of species</text><text x="85" y="178" font-size="10" fill="#5b6672">diffusion-limited current</text>
      <text x="261" y="111" font-weight="600">Particle tracing</text><text x="261" y="126" font-size="10" fill="#5b6672">landing vs swept away</text>
      <text x="411" y="111" font-weight="600">Design rules</text><text x="411" y="126" font-size="10" fill="#5b6672">disk vs ring UME</text>
    </g>

    <text x="16" y="222" font-size="13" font-weight="700">Validation · 10 µm disk electrode, background current</text>
    <g font-size="11">
      <line x1="120" y1="236" x2="120" y2="300" stroke="#d6dbe0"/>
      <line x1="440" y1="236" x2="440" y2="300" stroke="#d6dbe0"/>
      <text x="120" y="316" text-anchor="middle" fill="#5b6672">0.70 nA</text>
      <text x="440" y="316" text-anchor="middle" fill="#5b6672">0.95 nA</text>
      <text x="16" y="254">Measured</text>
      <rect x="401.6" y="243" width="89.6" height="14" rx="3" fill="#99d5cf" transform="translate(-140.8 0)"/>
      <text x="356" y="254" fill="#5b6672">0.81–0.88 nA</text>
      <text x="16" y="286">Simulated</text>
      <rect x="120" y="275" width="220.2" height="14" rx="3" fill="#0f766e"/>
      <text x="356" y="286" fill="#0f766e" font-weight="600">0.872 nA</text>
    </g>
  </g>
</svg>
