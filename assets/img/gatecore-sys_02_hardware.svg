<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>GateCore_V1.0 hardware block diagram</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="20" y="30" font-size="15" font-weight="700" fill="#0f172a">GateCore_V1.0 — 6-layer, ~65 × 30 mm, ENIG (signed off 2026-04-19, not yet ordered)</text>

  <!-- USB-C and ESD -->
  <rect x="20" y="60" width="140" height="66" rx="6" fill="#fff7ed" stroke="#fb923c"/>
  <text x="90" y="86" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">USB-C</text>
  <text x="90" y="104" font-size="12" text-anchor="middle" fill="#475569">device only</text>
  <text x="90" y="119" font-size="11" text-anchor="middle" fill="#64748b">CC1/CC2: 5.1 kΩ Rd</text>

  <rect x="200" y="60" width="150" height="66" rx="6" fill="#fff7ed" stroke="#fb923c"/>
  <text x="275" y="86" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">ESD</text>
  <text x="275" y="104" font-size="12" text-anchor="middle" fill="#475569">PRTR5V0U2X (D+/D−)</text>
  <text x="275" y="119" font-size="11" text-anchor="middle" fill="#64748b">first part after connector</text>

  <line x1="160" y1="93" x2="196" y2="93" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="350" y1="93" x2="476" y2="150" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="400" y="108" font-size="12" fill="#7c2d12">D+/D− 90 Ω diff</text>

  <text x="200" y="146" font-size="11.5" fill="#475569">VBUS → 30 kΩ → USB0_VBUS (sense)</text>
  <text x="200" y="162" font-size="11.5" fill="#475569">USB0_TXRTUNE → 200 Ω → GND</text>
  <text x="200" y="178" font-size="11.5" fill="#475569">USB0_ID: not connected</text>

  <!-- Power -->
  <line x1="90" y1="126" x2="90" y2="214" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="98" y="174" font-size="12" fill="#7c2d12">VBUS 5 V</text>

  <rect x="20" y="218" width="330" height="150" rx="6" fill="#fefce8" stroke="#eab308"/>
  <text x="36" y="242" font-size="14" font-weight="600" fill="#0f172a">4× TLV62569 DC-DC (no PMIC)</text>
  <text x="36" y="266" font-size="12.5" fill="#0f172a">0.8 V</text><text x="84" y="266" font-size="12" fill="#475569">core · KPU · CPU · DDR core · PLL</text>
  <text x="36" y="288" font-size="12.5" fill="#0f172a">1.1 V</text><text x="84" y="288" font-size="12" fill="#475569">LPDDR4 IO · VDD2 · VDDQ</text>
  <text x="36" y="310" font-size="12.5" fill="#0f172a">1.8 V</text><text x="84" y="310" font-size="12" fill="#475569">VDD1P8 · USB PHY · MIPI</text>
  <text x="36" y="332" font-size="12.5" fill="#0f172a">3.3 V</text><text x="84" y="332" font-size="12" fill="#475569">SD · USB · GPIO · WiFi</text>
  <text x="36" y="356" font-size="12" fill="#475569">XC6206P182 LDO → VDD_1V8_RTC</text>

  <line x1="350" y1="292" x2="476" y2="292" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- SoC -->
  <rect x="480" y="130" width="200" height="250" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="580" y="160" font-size="16" font-weight="700" text-anchor="middle" fill="#065f46">K230D SiP</text>
  <text x="580" y="184" font-size="12" text-anchor="middle" fill="#475569">LFBGA-256 · 0.65 mm</text>
  <text x="580" y="214" font-size="12.5" text-anchor="middle" fill="#0f172a">CPU1 C908 1.6 GHz RVV</text>
  <text x="580" y="234" font-size="12.5" text-anchor="middle" fill="#0f172a">CPU0 C908 800 MHz</text>
  <text x="580" y="254" font-size="12.5" text-anchor="middle" fill="#0f172a">KPU + AI2D</text>
  <text x="580" y="274" font-size="12.5" text-anchor="middle" fill="#0f172a">USB0 OTG + PHY</text>
  <text x="580" y="304" font-size="12.5" text-anchor="middle" fill="#0f172a">128 MB LPDDR4</text>
  <text x="580" y="322" font-size="11" text-anchor="middle" fill="#64748b">on package — no DDR routing</text>
  <text x="580" y="356" font-size="11" text-anchor="middle" fill="#64748b">crystals 24 MHz · 32.768 kHz</text>

  <!-- Peripherals -->
  <rect x="730" y="60" width="150" height="54" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="805" y="84" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">SPI NOR</text>
  <text x="805" y="102" font-size="11.5" text-anchor="middle" fill="#475569">W25Q · U-Boot</text>

  <rect x="730" y="130" width="150" height="54" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="805" y="154" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">MicroSD (TF)</text>
  <text x="805" y="172" font-size="11.5" text-anchor="middle" fill="#475569">kernel · rootfs · models</text>

  <rect x="730" y="200" width="150" height="54" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="805" y="224" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">WS2812B LED</text>
  <text x="805" y="242" font-size="11.5" text-anchor="middle" fill="#475569">+ button</text>

  <rect x="730" y="270" width="150" height="54" rx="6" fill="#fff" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="805" y="294" font-size="13" font-weight="600" text-anchor="middle" fill="#64748b">RTL8189FTV</text>
  <text x="805" y="312" font-size="11.5" text-anchor="middle" fill="#64748b">SDIO WiFi · v1.1</text>

  <rect x="730" y="340" width="150" height="54" rx="6" fill="#fff" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="805" y="364" font-size="13" font-weight="600" text-anchor="middle" fill="#64748b">MIPI CSI-2 FPC</text>
  <text x="805" y="382" font-size="11.5" text-anchor="middle" fill="#64748b">camera · v1.1</text>

  <line x1="680" y1="160" x2="728" y2="87" stroke="#334155" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="680" y1="180" x2="728" y2="157" stroke="#334155" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="680" y1="230" x2="728" y2="227" stroke="#334155" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="680" y1="290" x2="728" y2="297" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <line x1="680" y1="340" x2="728" y2="367" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- Notes -->
  <rect x="20" y="410" width="860" height="94" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="434" font-size="13" font-weight="600" fill="#0f172a">Open items for the pre-fab review</text>
  <text x="36" y="456" font-size="12" fill="#475569">• Power at VBUS under sustained inference not yet measured (USB 2.0 default budget 2.5 W)</text>
  <text x="36" y="476" font-size="12" fill="#475569">• Devkit bottom-side DC-DCs run hot → bottom copper / thermal vias under regulators and BGA</text>
  <text x="36" y="496" font-size="12" fill="#475569">• Board DTS: disable phantom usb@91540000 (K230D bonds out only USB0); WiFi/CSI nodes off for v1.0</text>
</svg>
