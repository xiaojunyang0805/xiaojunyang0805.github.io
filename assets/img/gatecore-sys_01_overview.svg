<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>GateCore system overview (architecture v0.3)</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="900" height="660" fill="#ffffff"/>

  <!-- HOST -->
  <rect x="20" y="20" width="860" height="200" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="36" y="44" font-size="15" font-weight="700" fill="#1e3a8a">HOST — any Linux x86 / ARM</text>

  <rect x="40" y="62" width="240" height="58" rx="6" fill="#fff" stroke="#60a5fa"/>
  <text x="160" y="86" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">Frigate NVR</text>
  <text x="160" y="106" font-size="12" text-anchor="middle" fill="#475569">detect_raw(uint8 1×320×320×3)</text>

  <rect x="320" y="62" width="250" height="58" rx="6" fill="#fff" stroke="#60a5fa"/>
  <text x="445" y="86" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">frigate-gatecore plugin</text>
  <text x="445" y="106" font-size="12" text-anchor="middle" fill="#475569">GateCoreDetector(DetectionApi)</text>

  <rect x="610" y="62" width="250" height="58" rx="6" fill="#fff" stroke="#60a5fa"/>
  <text x="735" y="86" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">Custom Python app</text>
  <text x="735" y="106" font-size="12" text-anchor="middle" fill="#475569">gc.detect(image)</text>

  <line x1="280" y1="91" x2="316" y2="91" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="445" y1="120" x2="445" y2="142" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="735" y1="120" x2="735" y2="142" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="146" width="820" height="58" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="450" y="170" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">gatecore Python SDK — open() · detect() · device_info() · ping()</text>
  <text x="450" y="190" font-size="12" text-anchor="middle" fill="#475569">Transport: pyserial → CDC-ACM (v1.0 default)  |  pyusb → FunctionFS bulk (fallback if throughput is short)</text>

  <!-- LINK -->
  <line x1="450" y1="220" x2="450" y2="268" stroke="#334155" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="470" y="230" width="380" height="28" rx="4" fill="#fff7ed" stroke="#fb923c"/>
  <text x="660" y="249" font-size="12.5" text-anchor="middle" fill="#7c2d12">USB 2.0 HS · GC01 protocol · /dev/ttyACMx ↔ /dev/ttyGS0</text>

  <!-- DEVICE -->
  <rect x="20" y="272" width="860" height="372" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="36" y="296" font-size="15" font-weight="700" fill="#0f172a">GATECORE DEVICE — K230D SiP · 128 MB LPDDR4 on package</text>

  <rect x="36" y="308" width="828" height="232" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="52" y="330" font-size="13.5" font-weight="700" fill="#065f46">CPU1 (big core) · C908 RV64GCV @ 1.6 GHz · Linux 6.6 — K230 Linux SDK, buildroot</text>

  <rect x="52" y="342" width="796" height="104" rx="6" fill="#fff" stroke="#10b981"/>
  <text x="66" y="362" font-size="13.5" font-weight="700" fill="#0f172a">gatecore-daemon</text>
  <text x="190" y="362" font-size="12" fill="#475569">single long-running process · model loaded once · mmz buffers allocated once</text>

  <rect x="66" y="374" width="300" height="58" rx="5" fill="#f0fdf4" stroke="#34d399"/>
  <text x="216" y="397" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">USB I/O thread</text>
  <text x="216" y="417" font-size="12" text-anchor="middle" fill="#475569">GC01 parse / reply on ttyGS0</text>

  <rect x="486" y="374" width="348" height="58" rx="5" fill="#f0fdf4" stroke="#34d399"/>
  <text x="660" y="397" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">Inference thread</text>
  <text x="660" y="417" font-size="12" text-anchor="middle" fill="#475569">AI2D → KPU (nncase 2.11) → decode + NMS (C)</text>

  <line x1="368" y1="394" x2="482" y2="394" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="482" y1="414" x2="368" y2="414" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="425" y="388" font-size="11" text-anchor="middle" fill="#475569">frame</text>
  <text x="425" y="428" font-size="11" text-anchor="middle" fill="#475569">result</text>

  <rect x="52" y="458" width="250" height="68" rx="5" fill="#fff" stroke="#94a3b8"/>
  <text x="177" y="481" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">DWC2 UDC + configfs</text>
  <text x="177" y="499" font-size="12" text-anchor="middle" fill="#475569">CDC-ACM 3 EP (+ ADB 2 EP dev)</text>
  <text x="177" y="515" font-size="11" text-anchor="middle" fill="#64748b">7 EP budget</text>

  <rect x="322" y="458" width="260" height="68" rx="5" fill="#fff" stroke="#94a3b8"/>
  <text x="452" y="481" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">k230_gnne · k230_ai2d</text>
  <text x="452" y="499" font-size="12" text-anchor="middle" fill="#475569">/dev/k230-gnne · /dev/k230-ai2d</text>
  <text x="452" y="515" font-size="11" text-anchor="middle" fill="#64748b">drivers/misc/canaan (in-kernel)</text>

  <rect x="602" y="458" width="246" height="68" rx="5" fill="#fff" stroke="#94a3b8"/>
  <text x="725" y="481" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">mmz allocator</text>
  <text x="725" y="499" font-size="12" text-anchor="middle" fill="#475569">/dev/mmz · 40 MB CMA</text>
  <text x="725" y="515" font-size="11" text-anchor="middle" fill="#64748b">~91 MB left for userspace</text>

  <line x1="216" y1="432" x2="177" y2="456" stroke="#334155" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="600" y1="432" x2="452" y2="456" stroke="#334155" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="720" y1="432" x2="725" y2="456" stroke="#334155" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- Hardware row -->
  <rect x="52" y="552" width="250" height="34" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="177" y="574" font-size="12.5" text-anchor="middle" fill="#0f172a">USB0 OTG + internal PHY</text>
  <rect x="322" y="552" width="260" height="34" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="452" y="574" font-size="12.5" text-anchor="middle" fill="#0f172a">KPU + AI2D hardware</text>
  <rect x="602" y="552" width="246" height="34" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="725" y="574" font-size="12.5" text-anchor="middle" fill="#0f172a">LPDDR4 128 MB</text>

  <rect x="52" y="598" width="390" height="34" rx="5" fill="#fff" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="247" y="620" font-size="12" text-anchor="middle" fill="#64748b">CPU0 (small core) · NuttX as shipped by SDK — not used</text>
  <rect x="458" y="598" width="390" height="34" rx="5" fill="#fff" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="653" y="620" font-size="12" text-anchor="middle" fill="#64748b">Populated, off in v1.0: RTL8189FTV WiFi · MIPI CSI</text>
</svg>
